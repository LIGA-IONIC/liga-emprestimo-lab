<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Emprestimo Lab</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#334155}
.btn.main{background:#334155}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Emprestimo Lab</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Notebook 03</strong><div class="muted">disponivel</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Notebook 07</strong><div class="muted">emprestado · atrasado</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Multimetro</strong><div class="muted">disponivel</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Protoboard kit</strong><div class="muted">emprestado</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Webcam lab</strong><div class="muted">disponivel</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Emprestimo Lab</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item">
        <div>
        <strong>Notebook 07</strong>
        <div>
        <span class="badge bad">atrasado</span>
        </div>
        </div>
        <button class="btn ghost" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">—</button>
        </div>
        <div class="aviso erro">Com emprestimo atrasado voce nao retira outro</div>
        <div class="item">
        <div>
        <strong>Notebook 03</strong>
        <div>
        <span class="badge ok">disponivel</span>
        </div>
        </div>
        <button class="btn ghost" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">bloqueado</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
